id: buffer_overflow_simple_003_riscv
case_id: simple_003
difficulty: easy
platform: riscv
defect_classes:
- interrupt_aware_array_oob
defects:
- variable: simple_003_global_var1
  pattern: check-access
  lines:
  - 37
  - 35
  - 57
