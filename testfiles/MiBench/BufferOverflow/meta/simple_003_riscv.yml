  - name: MachineTimer_IRQHandler
    line: 56
    vector: MachineTimer_IRQn
  switches:
  - op: enable
    api: PLIC_EnableIRQ
    target: MachineTimer_IRQn
    line: 35
  - op: enable
    api: __enable_irq
    target: global
    line: 36
